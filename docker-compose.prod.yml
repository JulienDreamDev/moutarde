services:
  frontend:
    build:
     context: ./moutarde-front
     dockerfile: Dockerfile.prod
    container_name: moutarde-frontend-prod
    ports:
     - "80:80"
    restart: unless-stopped

  backend:
    build:
      context: ./moutarde-back
      dockerfile: Dockerfile.prod
    container_name: moutarde-backend-prod
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:80 
      - ConnectionStrings__DefaultConnection=Host=database;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - JWT__SECRET=${JWT_SECRET}
      - JWT__ISSUER=${JWT_ISSUER}
      - JWT__AUDIENCE=${JWT_AUDIENCE}
      - JWT__EXPIRATION_HOURS=${JWT_EXPIRATION_HOURS}
    ports:
      - "5181:80"
    depends_on:
      database:
          condition: service_healthy
    restart: unless-stopped

  database:
    image: postgres:alpine
    container_name: moutarde-database-prod
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  
volumes:
  postgres_prod_data: