services:
  frontend:
    build:
     context: ./moutarde-front
     dockerfile: Dockerfile.dev
    ports:
     - "5180:5180"
    container_name: moutarde-frontend-dev
    volumes:
      - ./moutarde-front:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    restart: unless-stopped

  backend:
    build:
      context: ./moutarde-back
      dockerfile: Dockerfile.dev
    ports:
      - "5181:5181"
    container_name: moutarde-backend-dev
    volumes:
      - ./moutarde-back:/app
      - /app/moutarde-back/bin
      - /app/moutarde-back/obj
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://0.0.0.0:5181
    restart: unless-stopped